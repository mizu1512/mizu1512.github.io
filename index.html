<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mizanur Rahman | Video Editor & Motion Graphics Designer</title>
<meta name="description" content="Mizanur Rahman is a professional Video Editor and Motion Graphics Designer creating engaging videos, motion graphics, and visual stories.">

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root {
  --bg: #050914;
  --card: #0b1425;
  --text: #f4f7ff;
  --muted: #9ba9c3;
  --blue: #2997ff;
  --purple: #8b5cf6;
  --border: rgba(130,160,210,.16);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  font-family: Inter, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
}

a { color: inherit; text-decoration: none; }

.container {
  width: min(1120px, 90%);
  margin: auto;
}

header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(5,9,20,.88);
  backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--border);
}

.nav {
  min-height: 76px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 800;
  white-space: nowrap;
}

.logo-mark {
  font-size: 24px;
  font-style: italic;
  background: linear-gradient(135deg,#fff,#699dff);
  -webkit-background-clip: text;
  color: transparent;
}

.logo span:last-child { font-size: 14px; }

.nav-links {
  display: flex;
  gap: 24px;
  align-items: center;
  font-size: 12px;
  font-weight: 600;
}

.nav-links a { color: #dce5f7; transition: .3s; }
.nav-links a:hover { color: var(--blue); }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 13px 22px;
  border-radius: 30px;
  font-size: 12px;
  font-weight: 700;
  border: 1px solid var(--blue);
  color: white;
  background: linear-gradient(100deg,#1678ff,#8264f5);
  transition: .3s;
  cursor: pointer;
}

.btn:hover { transform: translateY(-2px); filter: brightness(1.12); }

.btn-outline { background: transparent; }

.menu-toggle {
  display: none;
  background: transparent;
  color: white;
  border: 1px solid var(--border);
  padding: 9px 12px;
  border-radius: 8px;
  font-size: 20px;
}

.hero {
  min-height: 620px;
  display: flex;
  align-items: center;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 80% 40%,rgba(0,102,255,.20),transparent 45%),
    radial-gradient(ellipse at 20% 30%,rgba(110,40,200,.13),transparent 45%);
}

.hero-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 40px;
  align-items: center;
}

.eyebrow {
  color: #55aaff;
  font-size: 11px;
  letter-spacing: 3px;
  font-weight: 700;
  margin-bottom: 18px;
  text-transform: uppercase;
}

h1 {
  font-size: clamp(35px,5vw,62px);
  line-height: 1.12;
  letter-spacing: -2px;
  margin-bottom: 22px;
}

.gradient {
  background: linear-gradient(100deg,#168bff,#9d72ff);
  -webkit-background-clip: text;
  color: transparent;
}

.hero p {
  color: var(--muted);
  font-size: 14px;
  max-width: 480px;
  margin-bottom: 28px;
}

.actions { display: flex; gap: 12px; flex-wrap: wrap; }

.socials {
  display: flex;
  gap: 16px;
  margin-top: 28px;
  color: #aebbd1;
  font-size: 13px;
}

.socials a:hover { color: var(--blue); }

.hero-visual {
  min-height: 390px;
  border: 1px solid #1d416d;
  border-radius: 20px;
  overflow: hidden;
  position: relative;
  background:
    linear-gradient(135deg,rgba(0,90,190,.25),transparent),
    radial-gradient(circle at 70% 30%,#163b69,#070d1a 65%);
  display: flex;
  align-items: center;
  justify-content: center;
}

.hero-visual::before {
  content: "";
  position: absolute;
  width: 260px;
  height: 260px;
  background: radial-gradient(circle,rgba(0,128,255,.35),transparent 70%);
  filter: blur(20px);
}

.monitor {
  width: 82%;
  aspect-ratio: 16/10;
  border: 8px solid #1a2b43;
  border-radius: 12px;
  background: #060b14;
  box-shadow: 0 25px 70px #0009;
  position: relative;
  z-index: 1;
  padding: 10px;
}

.screen {
  width: 100%;
  height: 100%;
  border-radius: 4px;
  background:
    linear-gradient(135deg,rgba(25,104,190,.4),transparent),
    linear-gradient(160deg,#172c47,#070c17);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px;
}

.screen-top { display: flex; justify-content: space-between; color: #7f9abf; font-size: 9px; }

.preview {
  height: 62%;
  background: linear-gradient(135deg,#162a42,#285e89,#0a1221);
  border-radius: 4px;
  position: relative;
  overflow: hidden;
}

.preview::after {
  content: "MOTION";
  position: absolute;
  font-size: 25px;
  font-weight: 800;
  letter-spacing: 5px;
  color: #ffffffb8;
  inset: 0;
  display: grid;
  place-items: center;
}

.timeline {
  height: 25%;
  background: repeating-linear-gradient(90deg,#1e4f9b 0 35px,#387cc7 35px 65px,#7a43b7 65px 100px);
  border-radius: 3px;
  opacity: .8;
}

.monitor-stand {
  width: 60px;
  height: 40px;
  background: #17263b;
  position: absolute;
  bottom: 24px;
  border-radius: 0 0 8px 8px;
}

.monitor-stand::after {
  content: "";
  position: absolute;
  width: 130px;
  height: 8px;
  background: #17263b;
  bottom: -5px;
  left: -35px;
  border-radius: 10px;
}

section { padding: 100px 0; }

.section-heading { margin-bottom: 40px; }

.section-heading h2 {
  font-size: clamp(28px,4vw,40px);
  line-height: 1.2;
  letter-spacing: -1px;
}

.section-heading p {
  color: var(--muted);
  font-size: 13px;
  max-width: 550px;
  margin-top: 12px;
}

.services-grid {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 16px;
}

.card {
  background: linear-gradient(145deg,#0c172a,#080f1e);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 25px;
  transition: .3s;
}

.card:hover {
  transform: translateY(-5px);
  border-color: #286db8;
}

.card-icon { font-size: 28px; margin-bottom: 15px; }

.card h3 { font-size: 15px; margin-bottom: 8px; }

.card p { color: var(--muted); font-size: 12px; }

.portfolio-grid {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 24px;
}

.project {
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: #0b1425;
}

.project-thumb {
  height: 245px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  background: linear-gradient(135deg,#1b304a,#080e1b);
}

.project-thumb::before {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 40%,#2475b955,transparent 65%);
}

.project-thumb h3 {
  font-size: clamp(24px,4vw,42px);
  text-align: center;
  letter-spacing: 3px;
  z-index: 1;
  font-weight: 800;
}

.project-thumb.motion {
  background: linear-gradient(135deg,#160b35,#070b1c);
}

.project-thumb.motion h3 {
  background: linear-gradient(90deg,#c45cff,#358eff);
  -webkit-background-clip: text;
  color: transparent;
}

.project-thumb.social {
  background: linear-gradient(135deg,#192b3d,#08111e);
}

.project-thumb.commercial {
  background: linear-gradient(135deg,#102d4b,#08101e);
}

.play {
  position: absolute;
  bottom: 16px;
  right: 16px;
  width: 42px;
  height: 42px;
  border: 1px solid #ffffff55;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: #ffffff18;
  font-size: 16px;
}

.project-info { padding: 20px; }

.project-info h3 { font-size: 16px; margin-bottom: 6px; }
.project-info p { color: var(--muted); font-size: 12px; }

.tags { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

.tag {
  font-size: 10px;
  border: 1px solid #274a78;
  padding: 4px 9px;
  border-radius: 20px;
  color: #91b7ed;
}

.about-grid {
  display: grid;
  grid-template-columns: .8fr 1.2fr;
  gap: 60px;
  align-items: center;
}

.about-image {
  min-height: 370px;
  border-radius: 18px;
  background: linear-gradient(145deg,#132d52,#080e1b);
  border: 1px solid #214a7c;
  display: grid;
  place-items: center;
  position: relative;
  overflow: hidden;
}

.about-image::before {
  content: "MR";
  font-size: 150px;
  font-weight: 800;
  color: rgba(255,255,255,0.03);
}
.contact-layout {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 50px;
  align-items: start;
}

.contact-info-list {
  display: flex;
  flex-direction: column;
  gap: 24px;
  margin-top: 30px;
}

.info-item label {
  display: block;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 4px;
}

.info-item p {
  font-size: 16px;
  font-weight: 600;
}

.form-box {
  background: var(--card);
  border: 1px solid var(--border);
  padding: 40px;
  border-radius: 16px;
}

.form-box form {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.form-box input, .form-box select, .form-box textarea {
  width: 100%;
  padding: 16px;
  background: #050914;
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: inherit;
  font-size: 14px;
}

.form-box input:focus, .form-box select:focus, .form-box textarea:focus {
  outline: none;
  border-color: var(--blue);
}

.submit-btn-style {
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: 30px;
  font-size: 14px;
  font-weight: 700;
  color: white;
  background: linear-gradient(100deg,#1678ff,#8264f5);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: .3s;
}

.submit-btn-style:hover {
  filter: brightness(1.15);
}

footer {
  text-align: center;
  padding: 40px 0;
  color: var(--muted);
  font-size: 13px;
  border-top: 1px solid var(--border);
  margin-top: 50px;
}

@media (max-width: 768px) {
  .contact-layout { grid-template-columns: 1fr; gap: 30px; }
  .hero-grid, .services-grid, .portfolio-grid, .about-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

  <header>
